apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: "llm-kv"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: hf-token
          objectType: secret
