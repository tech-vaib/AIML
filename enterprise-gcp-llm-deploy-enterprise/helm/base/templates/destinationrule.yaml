apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: vllm
spec:
  host: vllm
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
