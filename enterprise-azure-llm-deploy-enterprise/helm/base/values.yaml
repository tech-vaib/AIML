replicaCount: 2

gpuClass: a100

enableSpotScheduling: false

model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  quantization: awq

resources:
  requests:
    cpu: "4"
    memory: 16Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: "1"

autoscaling:
  minReplicas: 1
  maxReplicas: 10
  targetCPU: 70
  targetMemory: 80
  targetLatency: 200

pdb:
  minAvailable: 1
